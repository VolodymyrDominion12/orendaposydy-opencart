; ---------------------------------------------------------------------------
; PHP-конфіг для ЛОКАЛЬНОЇ розробки OpenCart 3.
; НЕ копіювати на прод: display_errors увімкнено навмисно.
; ---------------------------------------------------------------------------

; --- Помилки: локально ми хочемо їх бачити --------------------------------
display_errors = On
display_startup_errors = On
error_reporting = E_ALL
log_errors = On
error_log = /var/www/html/system/storage/logs/php-error.log

; --- Ліміти ---------------------------------------------------------------
; max_input_vars — найчастіша «загадка» в OpenCart.
; Сторінка товару з великою кількістю опцій/значень (а у вас саме такі)
; відправляє сотні полів. При дефолтних 1000 PHP мовчки обрізає POST,
; і частина опцій не зберігається — виглядає як баг OpenCart, хоча це PHP.
max_input_vars = 10000
max_input_time = 300
max_execution_time = 300
memory_limit = 512M
post_max_size = 128M
upload_max_filesize = 128M
max_file_uploads = 100

; --- OPcache --------------------------------------------------------------
; Увімкнений, але перевіряє час зміни файлів — інакше правки в PHP-коді
; не застосовуються без перезапуску контейнера.
opcache.enable = 1
opcache.enable_cli = 0
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
opcache.memory_consumption = 128
opcache.max_accelerated_files = 10000

; --- Час і кодування ------------------------------------------------------
; УВАГА, тут неочевидна пастка.
; Правильна сучасна назва зони — Europe/Kyiv, і системний tzdata (2026b) її знає.
; АЛЕ PHP зберігає ВЛАСНУ копію бази часових поясів, скомпільовану в бінарник,
; і в PHP 7.4 вона з 2021 року — тобто до перейменування (tzdata 2022b).
; Якщо поставити Europe/Kyiv, PHP на кожній сторінці пише:
;     Warning: Invalid date.timezone value 'Europe/Kyiv'
; і мовчки переходить на UTC — а це зсув на 2-3 години в датах замовлень.
; Europe/Kiev — чинний псевдонім тієї самої зони, його знають і старі, і нові бази.
; Зсув однаковий, тож на поведінку це не впливає.
date.timezone = Europe/Kiev
default_charset = "UTF-8"
mbstring.internal_encoding = "UTF-8"

; --- Сесії ----------------------------------------------------------------
; OpenCart зберігає сесії у файлах у system/storage/session
session.gc_maxlifetime = 86400
