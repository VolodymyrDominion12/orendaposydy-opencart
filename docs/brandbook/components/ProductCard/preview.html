<!-- @dsCard group="Каталог" height=420 -->
<!doctype html>
<html><head><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css"><meta charset="utf-8"><title>ProductCard</title>
<style>.ph{stroke:var(--silver);fill:none;stroke-width:1.5}</style></head>
<body>
<div class="kr-grid">
  <article class="kr-card">
    <div class="kr-card__media"><span class="kr-badge kr-badge--hit">Хіт</span>
      <svg viewBox="0 0 60 90" aria-hidden="true"><path class="ph" d="M14 6h32c0 22-6 34-16 36C20 40 14 28 14 6zM30 42v34M18 84h24"/></svg></div>
    <div class="kr-card__body">
      <span class="kr-card__cat">Скло</span>
      <h3 class="kr-card__name">Бокал для вина, 350 мл</h3>
      <span class="kr-card__meta">Арт. GL-0451 · 480 шт</span>
      <div class="kr-card__foot"><span class="kr-price">12 ₴ <small>/ доба</small></span>
        <button class="kr-btn kr-btn--primary" type="button">Додати</button></div>
    </div>
  </article>
  <article class="kr-card">
    <div class="kr-card__media"><span class="kr-badge kr-badge--stock">В наявності</span>
      <svg viewBox="0 0 90 60" aria-hidden="true"><ellipse class="ph" cx="45" cy="30" rx="40" ry="22"/><ellipse class="ph" cx="45" cy="30" rx="26" ry="13"/></svg></div>
    <div class="kr-card__body">
      <span class="kr-card__cat">Посуд</span>
      <h3 class="kr-card__name">Тарілка обідня, 27 см</h3>
      <span class="kr-card__meta">Арт. PL-0127 · 600 шт</span>
      <div class="kr-card__foot"><span class="kr-price">9 ₴ <small>/ доба</small></span>
        <button class="kr-btn kr-btn--secondary" type="button">Додати</button></div>
    </div>
  </article>
  <article class="kr-card">
    <div class="kr-card__media"><span class="kr-badge kr-badge--none">Немає на дату</span>
      <svg viewBox="0 0 80 80" aria-hidden="true"><path class="ph" d="M10 36h60M18 36v40M62 36v40M22 36c0-24 36-24 36 0"/></svg></div>
    <div class="kr-card__body">
      <span class="kr-card__cat">Меблі</span>
      <h3 class="kr-card__name">Стілець «Кьяварі», золото</h3>
      <span class="kr-card__meta">Арт. CH-0310 · 0 шт на 14.06</span>
      <div class="kr-card__foot"><span class="kr-price">85 ₴ <small>/ доба</small></span>
        <button class="kr-btn kr-btn--ghost" type="button">Інша дата</button></div>
    </div>
  </article>
</div>
</body></html>
